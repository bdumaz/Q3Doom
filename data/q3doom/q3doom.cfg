// Q3Doom defaults, executed after default.cfg and before q3config.cfg,
// so anything set here can be changed by the player and is saved.

bind e "+use"

// Doom's weapon slots: 1 fist/chainsaw, 2 pistol ... 7 BFG
bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"

// Doom's automap on Tab, the scores on F1
bind TAB "doom_automap"
bind F1 "+scores"

// DoomFrag: run the map again
bind r "doom_restart"
